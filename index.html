<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User ID Checker</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><style>body{font:16px system-ui,sans-serif;background:#f3f6f4;margin:0;padding:24px;color:#18251e}main{max-width:420px;margin:8vh auto;background:white;border-radius:24px;padding:28px;box-shadow:0 8px 30px #0001}h1{font-size:24px}img{width:76px;height:76px;border-radius:50%;object-fit:cover}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #ccd7cf;border-radius:10px;font-size:14px}button{width:100%;border:0;border-radius:12px;background:#008c40;color:white;padding:15px;margin-top:14px;font-size:16px;cursor:pointer}small{color:#526158} [hidden]{display:none!important}</style></head><body><main><h1>User ID Checker</h1><p>ตรวจสอบ LINE User ID ของคุณ</p><p id="status" role="status">กำลังเชื่อมต่อ LINE…</p><section id="profile" hidden><img id="picture" alt="รูปโปรไฟล์" hidden referrerpolicy="no-referrer"><h2 id="name"></h2><label for="uid">LINE User ID</label><input id="uid" readonly><button id="copy">คัดลอก User ID</button></section><p><small>ข้อมูลแสดงบนอุปกรณ์ของคุณเท่านั้น เว็บนี้ไม่บันทึกหรือส่ง User ID ไปยังฐานข้อมูล</small></p></main><script>const el=id=>document.getElementById(id);async function start(){try{await liff.init({liffId:'2012794571-FLYyxBXD'});if(!liff.isLoggedIn()){liff.login();return;}const p=await liff.getProfile();el('name').textContent=p.displayName;el('uid').value=p.userId;if(p.pictureUrl){el('picture').src=p.pictureUrl;el('picture').hidden=false;}el('profile').hidden=false;el('status').textContent='เชื่อมต่อสำเร็จ';}catch(e){el('status').textContent='ไม่สามารถโหลดโปรไฟล์ได้ กรุณาตรวจสอบ Endpoint URL และสิทธิ์ profile แล้วลองใหม่ ('+(e.code||'ERROR')+')';}}el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('uid').value);el('status').textContent='คัดลอกสำเร็จ';}catch{el('uid').focus();el('uid').select();el('status').textContent=document.execCommand('copy')?'คัดลอกสำเร็จ':'กรุณาคัดลอกข้อความที่เลือกด้วยตนเอง';}};start();</script></body></html>
